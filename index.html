<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorcycle Geometry Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Geist Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        input:focus { box-shadow: 0 0 0 2px rgba(161,161,170,0.1); }
    </style>
</head>
<body class="bg-black text-zinc-100 font-sans text-sm antialiased py-10 px-4">
<div class="max-w-3xl mx-auto space-y-4">

    <div class="mb-6">
        <h1 class="text-2xl font-semibold tracking-tight">Motorcycle Geometry Calculator</h1>
        <p class="text-zinc-500 text-sm mt-1">Iterative rake, trail, and seat height estimation across suspension scenarios.</p>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6 space-y-5">
        <div class="flex items-center gap-3 -mx-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">Initial Tires</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-6">
            <div class="space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Front</p>
                <div class="space-y-1.5">
                    <label for="initial-front-wheel" class="block text-sm font-medium text-zinc-200">Wheel Diameter (in)</label>
                    <input type="number" id="initial-front-wheel" step="1" value="21"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="initial-front-tire-width" class="block text-sm font-medium text-zinc-200">Tire Width (mm)</label>
                    <input type="number" id="initial-front-tire-width" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="initial-front-aspect-ratio" class="block text-sm font-medium text-zinc-200">Aspect Ratio (%)</label>
                    <input type="number" id="initial-front-aspect-ratio" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
            </div>
            <div class="space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Rear</p>
                <div class="space-y-1.5">
                    <label for="initial-rear-wheel" class="block text-sm font-medium text-zinc-200">Wheel Diameter (in)</label>
                    <input type="number" id="initial-rear-wheel" step="1" value="18"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="initial-rear-tire-width" class="block text-sm font-medium text-zinc-200">Tire Width (mm)</label>
                    <input type="number" id="initial-rear-tire-width" step="1" value="120"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="initial-rear-aspect-ratio" class="block text-sm font-medium text-zinc-200">Aspect Ratio (%)</label>
                    <input type="number" id="initial-rear-aspect-ratio" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 -mx-1 pt-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">New Tires</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-6">
            <div class="space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Front</p>
                <div class="space-y-1.5">
                    <label for="new-front-wheel" class="block text-sm font-medium text-zinc-200">Wheel Diameter (in)</label>
                    <input type="number" id="new-front-wheel" step="1" value="21"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="new-front-tire-width" class="block text-sm font-medium text-zinc-200">Tire Width (mm)</label>
                    <input type="number" id="new-front-tire-width" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="new-front-aspect-ratio" class="block text-sm font-medium text-zinc-200">Aspect Ratio (%)</label>
                    <input type="number" id="new-front-aspect-ratio" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
            </div>
            <div class="space-y-3">
                <p class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Rear</p>
                <div class="space-y-1.5">
                    <label for="new-rear-wheel" class="block text-sm font-medium text-zinc-200">Wheel Diameter (in)</label>
                    <input type="number" id="new-rear-wheel" step="1" value="18"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="new-rear-tire-width" class="block text-sm font-medium text-zinc-200">Tire Width (mm)</label>
                    <input type="number" id="new-rear-tire-width" step="1" value="120"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
                <div class="space-y-1.5">
                    <label for="new-rear-aspect-ratio" class="block text-sm font-medium text-zinc-200">Aspect Ratio (%)</label>
                    <input type="number" id="new-rear-aspect-ratio" step="1" value="90"
                        class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
                </div>
            </div>
        </div>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6 space-y-4">
        <div class="flex items-center gap-3 -mx-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">Geometry</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
                <label for="head-angle" class="block text-sm font-medium text-zinc-200">Rake from Vertical (°)</label>
                <input type="number" id="head-angle" step="0.1" value="27"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="wheelbase" class="block text-sm font-medium text-zinc-200">Wheelbase (mm)</label>
                <input type="number" id="wheelbase" step="1" value="1504"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
        </div>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6 space-y-4">
        <div class="flex items-center gap-3 -mx-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">Suspension</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
                <label for="initial-front-shock" class="block text-sm font-medium text-zinc-200">Initial Fork Length (mm)</label>
                <input type="number" id="initial-front-shock" step="1" value="915"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="updated-front-shock" class="block text-sm font-medium text-zinc-200">Updated Fork Length (mm)</label>
                <input type="number" id="updated-front-shock" step="1" value="915"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="fork-slide" class="block text-sm font-medium text-zinc-200">Fork Slide in Clamps (mm)</label>
                <input type="number" id="fork-slide" step="1" value="0"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="front-travel" class="block text-sm font-medium text-zinc-200">Front Travel (mm)</label>
                <input type="number" id="front-travel" step="1" value="300"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="initial-rear-shock" class="block text-sm font-medium text-zinc-200">Initial Rear Shock (mm, eye-to-eye)</label>
                <input type="number" id="initial-rear-shock" step="1" value="401"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="updated-rear-shock" class="block text-sm font-medium text-zinc-200">Updated Rear Shock (mm, eye-to-eye)</label>
                <input type="number" id="updated-rear-shock" step="1" value="401"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="linkage-ratio" class="block text-sm font-medium text-zinc-200">Rear Linkage Ratio</label>
                <input type="number" id="linkage-ratio" step="0.01" value="3.0"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="rear-travel" class="block text-sm font-medium text-zinc-200">Rear Travel (mm, vertical)</label>
                <input type="number" id="rear-travel" step="1" value="100"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
        </div>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6 space-y-4">
        <div class="flex items-center gap-3 -mx-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">Fork Offsets (perpendicular)</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
                <label for="initial-fork-offset" class="block text-sm font-medium text-zinc-200">Initial Fork Offset (mm)</label>
                <input type="number" id="initial-fork-offset" step="0.1" value="22"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="initial-fork-axle-offset" class="block text-sm font-medium text-zinc-200">Initial Axle Offset (mm)</label>
                <input type="number" id="initial-fork-axle-offset" step="0.1" value="35"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="updated-fork-offset" class="block text-sm font-medium text-zinc-200">Updated Fork Offset (mm)</label>
                <input type="number" id="updated-fork-offset" step="0.1" value="22"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="updated-fork-axle-offset" class="block text-sm font-medium text-zinc-200">Updated Axle Offset (mm)</label>
                <input type="number" id="updated-fork-axle-offset" step="0.1" value="35"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
        </div>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6 space-y-4">
        <div class="flex items-center gap-3 -mx-1">
            <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider whitespace-nowrap">Additional</span>
            <div class="flex-1 h-px bg-zinc-800"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-1.5">
                <label for="lowering-link" class="block text-sm font-medium text-zinc-200">Lowering Link (mm)</label>
                <input type="number" id="lowering-link" step="1" value="0"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
            <div class="space-y-1.5">
                <label for="initial-seat-height" class="block text-sm font-medium text-zinc-200">Initial Seat Height (mm)</label>
                <input type="number" id="initial-seat-height" step="1" value="900"
                    class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 outline-none focus:border-zinc-500 transition-colors">
            </div>
        </div>
    </div>

    <div class="flex flex-wrap gap-2 pt-1">
        <button onclick="calculateGeometry()"
            class="h-9 px-4 rounded-md bg-white text-black text-sm font-medium hover:bg-zinc-200 transition-colors">
            Calculate
        </button>
        <button onclick="exportCSV()"
            class="h-9 px-4 rounded-md border border-zinc-700 bg-transparent text-zinc-100 text-sm font-medium hover:bg-zinc-900 transition-colors">
            Export CSV
        </button>
    </div>

    <div class="flex gap-2 items-end">
        <div class="flex-1 space-y-1.5">
            <label for="setup-name" class="block text-sm font-medium text-zinc-200">Setup Name</label>
            <input type="text" id="setup-name" placeholder="e.g. High offset wheels"
                class="h-9 w-full rounded-md border border-zinc-800 bg-black px-3 text-sm text-zinc-100 placeholder:text-zinc-600 outline-none focus:border-zinc-500 transition-colors">
        </div>
        <button onclick="saveAsNew()"
            class="h-9 px-4 rounded-md border border-zinc-700 bg-transparent text-zinc-100 text-sm font-medium hover:bg-zinc-900 transition-colors whitespace-nowrap">
            Save As New
        </button>
        <button onclick="updateExisting()"
            class="h-9 px-4 rounded-md border border-zinc-700 bg-transparent text-zinc-100 text-sm font-medium hover:bg-zinc-900 transition-colors whitespace-nowrap">
            Update Existing
        </button>
    </div>

    <div id="results" class="border border-zinc-800 rounded-lg p-6">
        <p class="text-zinc-500 text-sm">Results will appear here.</p>
    </div>

    <div class="border border-zinc-800 rounded-lg p-6">
        <h2 class="text-sm font-semibold text-zinc-100 mb-4">Saved Setups</h2>
        <ul id="saved-list" class="space-y-2"></ul>
    </div>

</div>

<script>
let savedSetups = [];
let currentlyLoadedIndex = -1;

window.addEventListener('load', () => {
    const data = localStorage.getItem('savedSetups');
    if (data) {
        try {
            savedSetups = JSON.parse(data);
            renderSavedSetups();
        } catch (err) {
            console.warn("Failed to parse savedSetups from localStorage:", err);
        }
    }
});

function renderSavedSetups() {
    const list = document.getElementById('saved-list');
    list.innerHTML = '';

    savedSetups.forEach((item, index) => {
        let baselineRake = 0, baselineTrail = 0, baselineSeat = 0;

        if (item.scenarios && item.scenarios.baseline) {
            baselineRake = item.scenarios.baseline.rake;
            baselineTrail = item.scenarios.baseline.trail;
            baselineSeat = item.scenarios.baseline.seatHeight || 0;
        } else {
            const tempScenarios = calculateScenariosFromData(item.data);
            baselineRake = tempScenarios.baseline.rake;
            baselineTrail = tempScenarios.baseline.trail;
            baselineSeat = tempScenarios.baseline.seatHeight;
        }

        const li = document.createElement('li');
        li.className = 'flex items-center gap-3 px-3 py-2.5 bg-zinc-950 border border-zinc-800 rounded-md';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'flex-1 text-sm font-medium text-zinc-100 truncate';
        nameSpan.textContent = item.name;
        li.appendChild(nameSpan);

        const statsSpan = document.createElement('span');
        statsSpan.className = 'text-xs text-zinc-500 whitespace-nowrap';
        statsSpan.textContent = `${baselineRake.toFixed(1)}° · ${baselineTrail.toFixed(1)} mm · ${baselineSeat.toFixed(1)} mm`;
        li.appendChild(statsSpan);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'flex gap-1.5 flex-shrink-0';

        const loadBtn = document.createElement('button');
        loadBtn.textContent = 'Load';
        loadBtn.className = 'h-7 px-2.5 rounded border border-zinc-700 bg-transparent text-xs font-medium text-zinc-100 hover:bg-zinc-800 transition-colors';
        loadBtn.onclick = () => loadSetup(index);
        btnGroup.appendChild(loadBtn);

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Delete';
        delBtn.className = 'h-7 px-2.5 rounded bg-red-500 text-xs font-medium text-white hover:bg-red-600 transition-colors';
        delBtn.onclick = () => {
            savedSetups.splice(index, 1);
            localStorage.setItem('savedSetups', JSON.stringify(savedSetups));
            renderSavedSetups();
            currentlyLoadedIndex = -1;
        };
        btnGroup.appendChild(delBtn);

        li.appendChild(btnGroup);
        list.appendChild(li);
    });
}

function loadSetup(index) {
    currentlyLoadedIndex = index;
    const setup = savedSetups[index];
    const data = setup.data;

    document.getElementById('initial-front-wheel').value = data.initialFrontWheel;
    document.getElementById('initial-front-tire-width').value = data.initialFrontTireWidth;
    document.getElementById('initial-front-aspect-ratio').value = data.initialFrontAspect;

    document.getElementById('initial-rear-wheel').value = data.initialRearWheel;
    document.getElementById('initial-rear-tire-width').value = data.initialRearTireWidth;
    document.getElementById('initial-rear-aspect-ratio').value = data.initialRearAspect;

    document.getElementById('new-front-wheel').value = data.newFrontWheel;
    document.getElementById('new-front-tire-width').value = data.newFrontTireWidth;
    document.getElementById('new-front-aspect-ratio').value = data.newFrontAspect;

    document.getElementById('new-rear-wheel').value = data.newRearWheel;
    document.getElementById('new-rear-tire-width').value = data.newRearTireWidth;
    document.getElementById('new-rear-aspect-ratio').value = data.newRearAspect;

    document.getElementById('head-angle').value = data.headAngle;
    document.getElementById('wheelbase').value = data.wheelbase;

    document.getElementById('initial-front-shock').value = data.initialFrontShock;
    document.getElementById('updated-front-shock').value = data.updatedFrontShock;
    document.getElementById('fork-slide').value = data.forkSlide;

    document.getElementById('initial-rear-shock').value = data.initialRearShock;
    document.getElementById('updated-rear-shock').value = data.updatedRearShock;
    document.getElementById('linkage-ratio').value = data.linkageRatio;
    document.getElementById('rear-travel').value = data.rearTravel;
    document.getElementById('front-travel').value = data.frontTravel;

    document.getElementById('initial-fork-offset').value = data.initialForkOffset;
    document.getElementById('initial-fork-axle-offset').value = data.initialForkAxleOffset;
    document.getElementById('updated-fork-offset').value = data.updatedForkOffset;
    document.getElementById('updated-fork-axle-offset').value = data.updatedForkAxleOffset;

    document.getElementById('lowering-link').value = data.loweringLink || 0;
    document.getElementById('initial-seat-height').value = data.initialSeatHeight || 900;
    document.getElementById('setup-name').value = setup.name;

    calculateGeometry();
}

function saveAsNew() {
    const setupName = document.getElementById('setup-name').value.trim();
    if (!setupName) {
        alert("Please enter a name for this setup before saving.");
        return;
    }
    const data = gatherFormData();
    const scenarios = calculateScenariosFromData(data);
    savedSetups.push({ name: setupName, data, scenarios });
    localStorage.setItem('savedSetups', JSON.stringify(savedSetups));
    renderSavedSetups();
    currentlyLoadedIndex = -1;
}

function updateExisting() {
    if (currentlyLoadedIndex < 0) {
        alert("No setup is currently loaded. Please load a setup first.");
        return;
    }
    const setupName = document.getElementById('setup-name').value.trim();
    if (!setupName) {
        alert("Please enter a name for this setup before updating.");
        return;
    }
    const data = gatherFormData();
    const scenarios = calculateScenariosFromData(data);
    savedSetups[currentlyLoadedIndex].name = setupName;
    savedSetups[currentlyLoadedIndex].data = data;
    savedSetups[currentlyLoadedIndex].scenarios = scenarios;
    localStorage.setItem('savedSetups', JSON.stringify(savedSetups));
    renderSavedSetups();
}

function gatherFormData() {
    return {
        initialFrontWheel: document.getElementById('initial-front-wheel').value,
        initialFrontTireWidth: document.getElementById('initial-front-tire-width').value,
        initialFrontAspect: document.getElementById('initial-front-aspect-ratio').value,
        initialRearWheel: document.getElementById('initial-rear-wheel').value,
        initialRearTireWidth: document.getElementById('initial-rear-tire-width').value,
        initialRearAspect: document.getElementById('initial-rear-aspect-ratio').value,
        newFrontWheel: document.getElementById('new-front-wheel').value,
        newFrontTireWidth: document.getElementById('new-front-tire-width').value,
        newFrontAspect: document.getElementById('new-front-aspect-ratio').value,
        newRearWheel: document.getElementById('new-rear-wheel').value,
        newRearTireWidth: document.getElementById('new-rear-tire-width').value,
        newRearAspect: document.getElementById('new-rear-aspect-ratio').value,
        headAngle: document.getElementById('head-angle').value,
        wheelbase: document.getElementById('wheelbase').value,
        initialFrontShock: document.getElementById('initial-front-shock').value,
        updatedFrontShock: document.getElementById('updated-front-shock').value,
        forkSlide: document.getElementById('fork-slide').value,
        initialRearShock: document.getElementById('initial-rear-shock').value,
        updatedRearShock: document.getElementById('updated-rear-shock').value,
        linkageRatio: document.getElementById('linkage-ratio').value,
        rearTravel: document.getElementById('rear-travel').value,
        frontTravel: document.getElementById('front-travel').value,
        initialForkOffset: document.getElementById('initial-fork-offset').value,
        initialForkAxleOffset: document.getElementById('initial-fork-axle-offset').value,
        updatedForkOffset: document.getElementById('updated-fork-offset').value,
        updatedForkAxleOffset: document.getElementById('updated-fork-axle-offset').value,
        loweringLink: document.getElementById('lowering-link').value,
        initialSeatHeight: document.getElementById('initial-seat-height').value
    };
}

function exportCSV() {
    if (!savedSetups.length) {
        alert("No saved setups to export.");
        return;
    }

    let csv = "Setup Name,"
        + "Baseline Rake (deg),Baseline Trail (mm),Baseline Seat (mm),"
        + "Sag Rake (deg),Sag Trail (mm),Sag Seat (mm),"
        + "Full Comp Rake (deg),Full Comp Trail (mm),Full Comp Seat (mm),"
        + "Fork Full Comp Rake (deg),Fork Full Comp Trail (mm),Fork Full Comp Seat (mm),"
        + "Shock Full Comp Rake (deg),Shock Full Comp Trail (mm),Shock Full Comp Seat (mm),"
        + "Front Travel (mm),Rear Travel (mm)\n";

    savedSetups.forEach(item => {
        let sc = item.scenarios;
        if (!sc) sc = calculateScenariosFromData(item.data);
        const row = [
            `"${item.name}"`,
            sc.baseline.rake?.toFixed(2), sc.baseline.trail?.toFixed(1), sc.baseline.seatHeight?.toFixed(1),
            sc.sag.rake?.toFixed(2), sc.sag.trail?.toFixed(1), sc.sag.seatHeight?.toFixed(1),
            sc.fullComp.rake?.toFixed(2), sc.fullComp.trail?.toFixed(1), sc.fullComp.seatHeight?.toFixed(1),
            sc.forkCompRearExt.rake?.toFixed(2), sc.forkCompRearExt.trail?.toFixed(1), sc.forkCompRearExt.seatHeight?.toFixed(1),
            sc.shockCompForkExt.rake?.toFixed(2), sc.shockCompForkExt.trail?.toFixed(1), sc.shockCompForkExt.seatHeight?.toFixed(1),
            item.data.frontTravel, item.data.rearTravel
        ].join(",");
        csv += row + "\n";
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", "MotorcycleGeometry.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function calculateGeometry() {
    const data = gatherFormData();
    const scenarios = calculateScenariosFromData(data);

    const lbl = 'text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2 mt-5 first:mt-0';
    const val = 'text-sm text-zinc-100 bg-zinc-950 border border-zinc-800 rounded-md px-3 py-2.5 leading-relaxed';

    document.getElementById('results').innerHTML = `
        <p class="${lbl}">A — Baseline (Fully Extended)</p>
        <p class="${val}">Rake: ${scenarios.baseline.rake.toFixed(2)}° &nbsp;·&nbsp; Trail: ${scenarios.baseline.trail.toFixed(1)} mm &nbsp;·&nbsp; Seat: ${scenarios.baseline.seatHeight.toFixed(1)} mm</p>
        <p class="${lbl}">B — Rider Sag (33% each end)</p>
        <p class="${val}">Rake: ${scenarios.sag.rake.toFixed(2)}° &nbsp;·&nbsp; Trail: ${scenarios.sag.trail.toFixed(1)} mm &nbsp;·&nbsp; Seat: ${scenarios.sag.seatHeight.toFixed(1)} mm</p>
        <p class="${lbl}">C — Full Compression (Both Ends)</p>
        <p class="${val}">Rake: ${scenarios.fullComp.rake.toFixed(2)}° &nbsp;·&nbsp; Trail: ${scenarios.fullComp.trail.toFixed(1)} mm &nbsp;·&nbsp; Seat: ${scenarios.fullComp.seatHeight.toFixed(1)} mm</p>
        <p class="${lbl}">D — Fork Fully Compressed, Rear Extended</p>
        <p class="${val}">Rake: ${scenarios.forkCompRearExt.rake.toFixed(2)}° &nbsp;·&nbsp; Trail: ${scenarios.forkCompRearExt.trail.toFixed(1)} mm &nbsp;·&nbsp; Seat: ${scenarios.forkCompRearExt.seatHeight.toFixed(1)} mm</p>
        <p class="${lbl}">E — Shock Fully Compressed, Fork Extended</p>
        <p class="${val}">Rake: ${scenarios.shockCompForkExt.rake.toFixed(2)}° &nbsp;·&nbsp; Trail: ${scenarios.shockCompForkExt.trail.toFixed(1)} mm &nbsp;·&nbsp; Seat: ${scenarios.shockCompForkExt.seatHeight.toFixed(1)} mm</p>
    `;
}

function calculateScenariosFromData(d) {
    const iFW  = parseFloat(d.initialFrontWheel) * 25.4;
    const iFTW = parseFloat(d.initialFrontTireWidth);
    const iFAR = parseFloat(d.initialFrontAspect);
    const iRW  = parseFloat(d.initialRearWheel) * 25.4;
    const iRTW = parseFloat(d.initialRearTireWidth);
    const iRAR = parseFloat(d.initialRearAspect);

    const nFW  = parseFloat(d.newFrontWheel) * 25.4;
    const nFTW = parseFloat(d.newFrontTireWidth);
    const nFAR = parseFloat(d.newFrontAspect);
    const nRW  = parseFloat(d.newRearWheel) * 25.4;
    const nRTW = parseFloat(d.newRearTireWidth);
    const nRAR = parseFloat(d.newRearAspect);

    const headAngle = parseFloat(d.headAngle);
    const wheelbase = parseFloat(d.wheelbase);

    const iFShock  = parseFloat(d.initialFrontShock);
    const uFShock  = parseFloat(d.updatedFrontShock);
    const forkSlide = parseFloat(d["fork-slide"]) || parseFloat(d.forkSlide) || 0;

    const iRShock = parseFloat(d.initialRearShock);
    const uRShock = parseFloat(d.updatedRearShock);
    const linkage = parseFloat(d.linkageRatio);

    const rTravel = parseFloat(d.rearTravel);
    const fTravel = parseFloat(d.frontTravel);

    const iFOffset = parseFloat(d.initialForkOffset);
    const iFAxOff  = parseFloat(d.initialForkAxleOffset);
    const uFOffset = parseFloat(d.updatedForkOffset);
    const uFAxOff  = parseFloat(d.updatedForkAxleOffset);

    const loweringLink      = parseFloat(d.loweringLink) || 0;
    const initialSeatHeight = parseFloat(d.initialSeatHeight) || 900;

    const totalInitialOffset = iFOffset + iFAxOff;
    const totalUpdatedOffset = uFOffset + uFAxOff;

    const initFrontDiam = calculateTireDiameter(iFW, iFTW, iFAR);
    const initRearDiam  = calculateTireDiameter(iRW, iRTW, iRAR);
    const newFrontDiam  = calculateTireDiameter(nFW, nFTW, nFAR);
    const newRearDiam   = calculateTireDiameter(nRW, nRTW, nRAR);

    const angleRad = headAngle * (Math.PI / 180);
    const initFrontRelHeight =
        (initFrontDiam / 2)
      + (iFShock * Math.cos(angleRad))
      - (totalInitialOffset * Math.sin(angleRad));
    const initRearRelHeight =
        (initRearDiam / 2)
      + (iRShock * linkage);
    const initHeightDiff = initFrontRelHeight - initRearRelHeight;

    function runScenario(frontLen, rearLen) {
        const result = iterativeRakeTrail(
            frontLen, rearLen,
            newFrontDiam / 2, newRearDiam / 2,
            totalUpdatedOffset, headAngle, wheelbase,
            initHeightDiff, linkage, loweringLink,
            initFrontRelHeight, initRearRelHeight
        );
        return { rake: result.angleDeg, trail: result.trail, seatHeight: initialSeatHeight + result.seatOffset };
    }

    const baseline         = runScenario(Math.max(0, uFShock - forkSlide), uRShock);
    const sag              = runScenario(Math.max(0, (uFShock - (0.33 * fTravel)) - forkSlide), Math.max(0, uRShock - ((0.33 * rTravel) / linkage)));
    const fullComp         = runScenario(Math.max(0, (uFShock - fTravel) - forkSlide), Math.max(0, uRShock - (rTravel / linkage)));
    const forkCompRearExt  = runScenario(Math.max(0, (uFShock - fTravel) - forkSlide), uRShock);
    const shockCompForkExt = runScenario(Math.max(0, uFShock - forkSlide), uRShock - (rTravel / linkage));

    return { baseline, sag, fullComp, forkCompRearExt, shockCompForkExt };
}

function iterativeRakeTrail(
    frontShockLen, rearShockLen,
    newFrontRadius, newRearRadius,
    totalUpdatedOffset, initHeadAngleDeg, wheelbase,
    initHeightDiff, linkageRatio, loweringLink,
    initFrontRel, initRearRel
) {
    const maxIter = 20;
    const tolerance = 0.001;
    let angleDeg = initHeadAngleDeg;

    for (let i = 0; i < maxIter; i++) {
        const angleRad = angleDeg * (Math.PI / 180);

        const frontRelativeHeight =
            newFrontRadius
            + (frontShockLen * Math.cos(angleRad))
            - (totalUpdatedOffset * Math.sin(angleRad));

        const rearRelativeHeight =
            newRearRadius
            + (rearShockLen * linkageRatio)
            - loweringLink;

        const newHeightDiff = frontRelativeHeight - rearRelativeHeight;
        const nextAngleDeg = initHeadAngleDeg + (
            Math.atan2(newHeightDiff, wheelbase) * (180 / Math.PI)
            - Math.atan2(initHeightDiff, wheelbase) * (180 / Math.PI)
        );

        if (Math.abs(nextAngleDeg - angleDeg) < tolerance) {
            angleDeg = nextAngleDeg;
            break;
        }
        angleDeg = nextAngleDeg;
    }

    const finalAngleRad = angleDeg * (Math.PI / 180);
    const finalFrontRelHeight =
        newFrontRadius
        + (frontShockLen * Math.cos(finalAngleRad))
        - (totalUpdatedOffset * Math.sin(finalAngleRad));
    const finalRearRelHeight =
        newRearRadius
        + (rearShockLen * linkageRatio)
        - loweringLink;

    const offsetHorizontal = totalUpdatedOffset * Math.cos(finalAngleRad);
    const noOffsetTrail = newFrontRadius * Math.tan(finalAngleRad);
    const trail = noOffsetTrail - offsetHorizontal;

    const seatOffset = 0.5 * (finalFrontRelHeight + finalRearRelHeight)
                     - 0.5 * (initFrontRel + initRearRel);

    return { angleDeg, trail, seatOffset };
}

function calculateTireDiameter(rimDiameterMm, tireWidth, aspectRatio) {
    return rimDiameterMm + 2 * (tireWidth * (aspectRatio / 100));
}
